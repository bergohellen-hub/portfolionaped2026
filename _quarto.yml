# ---------------------------------------------------------------------------
# Configuração única do portfólio do NAPED.
#
# Este é o ÚNICO arquivo onde moram o menu, o tema e as regras de publicação.
# Antes, o menu estava copiado dentro dos 14 arquivos .html — mudar um item
# obrigava a editar todos. Agora é uma linha, aqui.
#
# Para publicar uma AÇÃO nova você NÃO precisa mexer neste arquivo.
# Basta criar um arquivo em acoes/. Veja o COMO-ATUALIZAR.md.
# ---------------------------------------------------------------------------

project:
  type: website
  output-dir: _site
  # Confere as ações e cria a página do mês que faltar. Se algo estiver
  # errado, a publicação para aqui com uma explicação em português.
  pre-render: scripts/preparar.R
  render:
    - "*.qmd"
    - "acoes/*.qmd"
    - "meses/*.qmd"
    - "paginas/*.qmd"
    - "!README.md"
  resources:
    # Arquivos que o Quarto não descobre sozinho: o fundo vem de uma regra
    # url() dentro do styles.scss, e o vídeo vem de uma tag <video> crua.
    - fotos/fundo-organico.svg
    - fotos/fundo-cabecalho.svg
    - fotos/*.mp4

website:
  title: "Portfólio NAPED"
  description: "Registro das ações do Núcleo de Apoio Pedagógico e Experiência Docente — Afya São João del-Rei"
  site-url: "https://bergohellen-hub.github.io/portfolionaped2026/"
  favicon: fotos/naped-afya.png

  navbar:
    logo: fotos/naped-afya.png
    title: false
    left:
      - href: index.qmd
        text: Início
      # Uma entrada só, de propósito: a página lista os meses que existem.
      # Assim, começar um mês novo não pede editar este arquivo.
      - href: meses.qmd
        text: Meses
      - text: "Projetos"
        menu:
          - href: paginas/projeto-move.qmd
            text: Projeto MOVE
          - href: paginas/mentoria.qmd
            text: Projeto Mentoria ENAMED
          - href: paginas/preceptoria.qmd
            text: Preceptoria
          - href: paginas/sdd-julho.qmd
            text: "SDD 2026.2 — Julho"
          - href: paginas/podcast-etica-medica.qmd
            text: "Podcast Ética Médica"
          - href: paginas/sthem.qmd
            text: "STHEM Brasil"
      - href: paginas/equipe.qmd
        text: Equipe
      - href: dashboard.qmd
        text: Painel
      - text: "Em Números"
        menu:
          - href: paginas/em-numeros.qmd
            text: "2026.1"
          - href: paginas/em-numeros-2026-2.qmd
            text: "2026.2"
      - href: paginas/comprovacoes.qmd
        text: Comprovações
    right:
      - href: manual.qmd
        text: Manual
      - icon: github
        href: https://github.com/bergohellen-hub/portfolionaped2026
        aria-label: Repositório no GitHub

  page-footer:
    center: "Centro Universitário Afya · São João del-Rei · MG"
    background: light

  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      - cosmo
      - styles.scss
    # agrupa a barra de Categorias da vitrine em "Meses" e "Temas"
    include-after-body: categorias-agrupadas.html
    toc: true
    toc-title: "Nesta página"
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    lightbox: auto        # clicar na foto abre em tela cheia, como no site antigo
    link-external-newwindow: true
    fig-align: center

execute:
  # SEM freeze, de propósito. O Painel lê a pasta acoes/ em tempo de build.
  # Com "freeze: auto" ele só recalcularia quando dashboard.qmd mudasse, e
  # uma ação nova não apareceria no Painel — quebrando a regra de que criar
  # um arquivo basta. Recalcular sempre custa segundos e nunca fica errado.
  freeze: false

lang: pt
