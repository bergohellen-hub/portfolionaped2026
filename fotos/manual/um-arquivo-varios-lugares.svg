<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img"
     aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Um arquivo aparece em quatro lugares</title>
  <desc id="d">Um único arquivo de ação, com suas etiquetas, alimenta a
  página inicial, a página do mês, os filtros por eixo e o Painel.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5007E" opacity=".55"/>
    </marker>
  </defs>

  <!-- o arquivo -->
  <g>
    <rect x="20" y="120" width="250" height="190" rx="12"
          fill="#fff" stroke="#E5007E" stroke-width="2"/>
    <rect x="20" y="120" width="250" height="30" rx="12" fill="#fce4f0"/>
    <rect x="20" y="138" width="250" height="12" fill="#fce4f0"/>
    <text x="36" y="141" font-size="12.5" font-weight="700" fill="#a8005c"
          font-family="Georgia, serif">1 arquivo</text>
    <text x="36" y="176" font-size="12" fill="#555" font-family="monospace">acoes/</text>
    <text x="36" y="193" font-size="12" fill="#555" font-family="monospace">2026-08-roda.qmd</text>

    <line x1="36" y1="208" x2="254" y2="208" stroke="#eee" stroke-width="1"/>

    <text x="36" y="230" font-size="11.5" fill="#888" font-family="monospace">title:</text>
    <text x="96" y="230" font-size="11.5" fill="#2d2d2d" font-family="monospace">"Roda de conversa"</text>

    <text x="36" y="252" font-size="11.5" fill="#888" font-family="monospace">categories:</text>
    <g>
      <rect x="36" y="262" width="62" height="19" rx="9.5" fill="#E5007E"/>
      <text x="67" y="275.5" font-size="10.5" font-weight="700" fill="#fff"
            text-anchor="middle">Agosto</text>
      <rect x="104" y="262" width="126" height="19" rx="9.5" fill="#E5007E"/>
      <text x="167" y="275.5" font-size="10.5" font-weight="700" fill="#fff"
            text-anchor="middle">Formação Docente</text>
    </g>

    <text x="36" y="300" font-size="11.5" fill="#888" font-family="monospace">participantes:</text>
    <text x="140" y="300" font-size="11.5" fill="#2d2d2d" font-family="monospace">22</text>
  </g>

  <!-- setas -->
  <g fill="none" stroke="#E5007E" stroke-width="1.6" opacity=".55" marker-end="url(#seta)">
    <path d="M280,180 C350,180 350,60 420,60"/>
    <path d="M280,200 C350,200 350,158 420,158"/>
    <path d="M280,240 C350,240 350,256 420,256"/>
    <path d="M280,262 C350,262 350,354 420,354"/>
  </g>

  <!-- destinos -->
  <g font-size="13.5">
    <g>
      <rect x="430" y="34" width="430" height="54" rx="10" fill="#fff"
            stroke="#eee" stroke-width="1.5"/>
      <rect x="430" y="34" width="4" height="54" rx="2" fill="#E5007E"/>
      <text x="452" y="55" font-weight="700" fill="#1a1a1a"
            font-family="Georgia, serif">Página inicial</text>
      <text x="452" y="74" font-size="11.5" fill="#888">o cartão entra na vitrine, com foto e etiquetas</text>
    </g>
    <g>
      <rect x="430" y="132" width="430" height="54" rx="10" fill="#fff"
            stroke="#eee" stroke-width="1.5"/>
      <rect x="430" y="132" width="4" height="54" rx="2" fill="#E5007E"/>
      <text x="452" y="153" font-weight="700" fill="#1a1a1a"
            font-family="Georgia, serif">Página de Agosto</text>
      <text x="452" y="172" font-size="11.5" fill="#888">porque a etiqueta diz Agosto</text>
    </g>
    <g>
      <rect x="430" y="230" width="430" height="54" rx="10" fill="#fff"
            stroke="#eee" stroke-width="1.5"/>
      <rect x="430" y="230" width="4" height="54" rx="2" fill="#E5007E"/>
      <text x="452" y="251" font-weight="700" fill="#1a1a1a"
            font-family="Georgia, serif">Filtro “Formação Docente”</text>
      <text x="452" y="270" font-size="11.5" fill="#888">porque a etiqueta diz Formação Docente</text>
    </g>
    <g>
      <rect x="430" y="328" width="430" height="54" rx="10" fill="#fff"
            stroke="#eee" stroke-width="1.5"/>
      <rect x="430" y="328" width="4" height="54" rx="2" fill="#E5007E"/>
      <text x="452" y="349" font-weight="700" fill="#1a1a1a"
            font-family="Georgia, serif">Painel</text>
      <text x="452" y="368" font-size="11.5" fill="#888">soma +1 ação em Agosto e +22 pessoas</text>
    </g>
  </g>

  <text x="20" y="410" font-size="11.5" fill="#888">
    Você escreve num lugar só. Os quatro se atualizam sozinhos.
  </text>
</svg>
