<script>
document.addEventListener("DOMContentLoaded", function () {
  var wrap = document.querySelector(".quarto-listing-category");
  if (!wrap) return;

  var MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
               "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  var itens = Array.from(wrap.querySelectorAll(".category"));
  var todos = itens.find(function (el) { return el.getAttribute("data-category") === ""; });
  var resto = itens.filter(function (el) { return el !== todos; });

  function nomeDe(el) {
    return el.childNodes[0].textContent.trim();
  }

  var meses = resto.filter(function (el) { return MESES.indexOf(nomeDe(el)) !== -1; });
  var temas = resto.filter(function (el) { return MESES.indexOf(nomeDe(el)) === -1; });

  meses.sort(function (a, b) {
    return MESES.indexOf(nomeDe(a)) - MESES.indexOf(nomeDe(b));
  });

  wrap.innerHTML = "";
  if (todos) wrap.appendChild(todos);

  function grupo(titulo, lista) {
    if (!lista.length) return;
    var h = document.createElement("div");
    h.className = "listing-category-group";
    h.textContent = titulo;
    wrap.appendChild(h);
    lista.forEach(function (el) { wrap.appendChild(el); });
  }

  grupo("Meses", meses);
  grupo("Temas", temas);
});
</script>
